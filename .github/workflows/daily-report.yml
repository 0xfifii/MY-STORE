# Optional external trigger for the report job. Not needed normally: the app has a built-in
# scheduler. To use it, add repository secrets APP_URL and CRON_SECRET, then uncomment "schedule".
name: Report trigger (optional)
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "*/30 * * * *"
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call MY STORE
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL/CRON_SECRET secrets not set - skipping"; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/daily-report"
